version: '3.8'

# Quick-start local dev services (PostgreSQL + Redis only)
# Usage: docker-compose -f infrastructure/docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: mt-postgres-dev
    environment:
      POSTGRES_DB:       moneytracker
      POSTGRES_USER:     moneytracker
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneytracker -d moneytracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mt-redis-dev
    ports:
      - "6380:6379"
    volumes:
      - redis_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev:
  redis_dev:
