name: Backend CI

on:
  pull_request:
    branches: [main, develop]
    paths: ['backend/**']
  push:
    branches: [main]
    paths: ['backend/**']

jobs:
  test:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       moneytracker_test
          POSTGRES_USER:     moneytracker
          POSTGRES_PASSWORD: testpassword
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U moneytracker -d moneytracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://moneytracker:testpassword@localhost:5432/moneytracker_test

      - name: Run migrations
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://moneytracker:testpassword@localhost:5432/moneytracker_test

      - name: Prisma schema validate
        run: npx prisma validate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://moneytracker:testpassword@localhost:5432/moneytracker_test

      - name: Run tests
        run: npm test --if-present
        working-directory: backend
        env:
          DATABASE_URL:         postgresql://moneytracker:testpassword@localhost:5432/moneytracker_test
          REDIS_URL:            redis://localhost:6379
          JWT_SECRET:           test-secret-at-least-32-characters-long
          JWT_REFRESH_SECRET:   test-refresh-secret-32-characters-long
          NODE_ENV:             test

      - name: TypeScript build check
        run: npm run build
        working-directory: backend
        env:
          DATABASE_URL: postgresql://moneytracker:testpassword@localhost:5432/moneytracker_test
